[project]
name = "mlops-sandbox"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.8",
    "mlflow>=3.10.1",
    "pandas>=2.3.3",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "ruff>=0.15.8",
]

[tool.mypy]
# 型定義がないライブラリ（sklearnやpandasなど）をエラーにしない設定
ignore_missing_imports = true

# チェック対象外にするフォルダ（.venvなどは除外）
exclude = ["\\.venv"]
